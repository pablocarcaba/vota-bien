name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validar clasificación
        run: python3 scripts/validar_clasificacion.py
      - name: Tests
        run: python3 -m unittest discover -s tests -v
